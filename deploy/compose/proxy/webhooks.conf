# proxy-webhooks (ADR 0032): HTTPS for SaaS webhooks, forwarded to edge-gateway over mutual TLS.
# Only POST /webhooks/<source id> passes; the gateway checks the provider's signature. The
# client certificate has the `proxy` role, which the gateway accepts on /webhooks only (ADR 0031).

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;
    # Method, path without the query string, status and timing; never a header or a body.
    log_format carto escape=json
        '{"service":"proxy-webhooks","method":"$request_method","path":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time}';
    access_log /dev/stdout carto;

    # 10 requests per second per client IP, bursts of 50; 429 beyond (spec 14.7).
    limit_req_zone $binary_remote_addr zone=webhooks:10m rate=10r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    limit_conn_status 429;

    # Spec 8.1.6: 1 MB bodies. Headers and slow clients are bounded too.
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    large_client_header_buffers 4 8k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;

    upstream gateway {
        server edge-gateway:8443;
    }

    server {
        listen 8443 ssl;
        # The customer's certificate for the webhook host name (deploy/compose/proxy-tls).
        ssl_certificate /etc/carto/proxy-tls/tls.crt;
        ssl_certificate_key /etc/carto/proxy-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        limit_conn connections 20;

        location ~ "^/webhooks/[a-z][a-z0-9_]{0,63}$" {
            limit_except POST {
                deny all;
            }
            limit_req zone=webhooks burst=50 nodelay;

            proxy_pass https://gateway;
            proxy_http_version 1.1;
            proxy_request_buffering on;
            proxy_set_header Host edge-gateway;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            # Mutual TLS to the gateway: its listener CA, verified by name, and our `proxy` role.
            proxy_ssl_certificate /etc/carto/pki/to-edge-gateway.crt;
            proxy_ssl_certificate_key /etc/carto/pki/to-edge-gateway.key;
            proxy_ssl_trusted_certificate /etc/carto/pki/to-edge-gateway-ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_name edge-gateway;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
        }

        location / {
            return 404;
        }
    }
}
