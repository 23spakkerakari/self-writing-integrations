# proxy-otlp (ADR 0032): TCP passthrough for OTLP from collectors on other hosts. The TLS
# connection reaches edge-gateway unopened, so the gateway sees the collector's own certificate:
# signed by the edge-gateway CA, with the `collector` role (ADR 0031, `carto-ctl pki issue`).

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

stream {
    # Connection-level only: the proxy never sees a request, a header or a body.
    log_format carto escape=json
        '{"service":"proxy-otlp","status":$status,"bytes_in":$bytes_received,'
        '"bytes_out":$bytes_sent,"duration_s":$session_time}';
    access_log /dev/stdout carto;

    limit_conn_zone $binary_remote_addr zone=collectors:10m;

    server {
        listen 4318;
        limit_conn collectors 32;
        proxy_pass edge-gateway:8443;
        proxy_connect_timeout 5s;
        proxy_timeout 120s;
    }
}
