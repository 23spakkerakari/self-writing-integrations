# carto pilot stack (spec 5.5 "Pilot: Docker Compose on one VM", 14.5 "Compose: internal Docker
# networks; only the reverse proxy publishes a port", 14.6 container hardening).
#
# M1 services: PostgreSQL, ClickHouse, ingest-api, edge-gateway, the OpenTelemetry Collector and
# the simulator in live mode for `make dev`. M2 adds the console: `api` (spec 12), `worker` (the
# profiler and linker jobs, spec 5.3), `web` (nginx serving the console and proxying /api/ to
# `api` over mutual TLS, the one origin of ADR 0052; it publishes CARTO_WEB_PORT) and, under the
# `dev` profile only, `dex` as the identity provider (ADR 0052). Passwords come from Docker
# secrets (files under ./secrets, never from the environment); keys live in the edge state
# volume wrapped by the local KMS (ADR 0012). Each core process connects as its own database
# role (postgres/init-roles.sh, spec 14.4): carto_ingest, carto_app, carto_worker.
#
# One-shot jobs run in this order on every `up` and are idempotent:
#   volumes-init  chowns the named volumes to the carto uid (a new volume is root-owned)
#   pki-init      carto-ctl pki init --if-missing: a CA per listener and one volume per service
#                 holding only its own keys and role certificates (ADR 0031); the CA keys go to
#                 the pki-ca volume, which no running service mounts (spec 14.4)
#   key-init      carto-ctl key init --if-missing (local KMS; production uses Vault Transit)
#   migrate       carto-core migrate
#
# Push routes (ADR 0032), each off until its profile is enabled; they are the only services that
# publish a port (spec 14.5):
#   proxy-otlp      --profile push-otlp       TCP passthrough on CARTO_OTLP_PORT (4318) for
#                                              collectors holding a `carto-ctl pki issue` cert
#   proxy-webhooks  --profile push-webhooks   HTTPS on CARTO_WEBHOOK_PORT (8443), certificate in
#                                              ./proxy-tls, forwarded to the gateway as `proxy`
#
# Every service has mem_limit, cpus and pids_limit (spec 14.6, 2.3 invariant 8), sized for the
# pilot VM of spec 5.5; ClickHouse reads its cgroup limit and keeps its own memory under it.
#
# First run:   make dev
# Tear down:   docker compose -f deploy/compose/compose.yaml down -v

name: carto

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  tmpfs: ["/tmp:size=64m"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

# The official database images start as root, chown their data directory and drop to their own
# user, which needs these capabilities and nothing else; no-new-privileges still applies.
x-db-capabilities: &db-capabilities
  cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]

networks:
  core:
    internal: true
  edge:
    internal: true
  # Only the push proxies join it: an internal network cannot publish a port.
  ingress: {}

volumes:
  pg-data:
  ch-data:
  edge-state:
  # One volume per service, each holding only that service's key (ADR 0031).
  pki-ingest-api:
  pki-edge-gateway:
  pki-otel-collector:
  pki-proxy:
  pki-api:
  pki-web:
  pki-ca:
  sim-data:
  otel-queue:

secrets:
  pg_password:
    file: ./secrets/pg_password
  ch_password:
    file: ./secrets/ch_password
  pg_ingest_password:
    file: ./secrets/pg_ingest_password
  pg_app_password:
    file: ./secrets/pg_app_password
  pg_worker_password:
    file: ./secrets/pg_worker_password
  oidc_client_secret:
    file: ./secrets/oidc_client_secret

services:
  postgres:
    image: postgres:16.6-bookworm
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    <<: [*hardening, *db-capabilities]
    networks: [core]
    environment:
      POSTGRES_DB: carto
      POSTGRES_USER: carto
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password, pg_ingest_password, pg_app_password, pg_worker_password]
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Creates the per-service roles on first start only (an initialized volume skips it).
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    tmpfs: ["/tmp:size=64m", "/run/postgresql:size=16m"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carto -d carto"]
      interval: 10s
      timeout: 5s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 2048
    <<: [*hardening, *db-capabilities]
    # The image's init step (create the database) stops its temporary server, which runs as the
    # clickhouse uid, from the root entrypoint: that signal needs KILL on top of the db set.
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID", "KILL"]
    networks: [core]
    environment:
      CLICKHOUSE_DB: carto
      CLICKHOUSE_USER: carto
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/ch_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    secrets: [ch_password]
    volumes:
      - ch-data:/var/lib/clickhouse
      # One file into users.d; the directory itself is a tmpfs because the image's entrypoint
      # writes users.d/default-user.xml for CLICKHOUSE_USER on a read-only root filesystem.
      - ./clickhouse/users.d/carto.xml:/etc/clickhouse-server/users.d/carto.xml:ro
    tmpfs:
      - "/tmp:size=256m"
      - "/var/log/clickhouse-server:size=128m"
      - "/etc/clickhouse-server/users.d:size=1m"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  volumes-init:
    image: carto-ctl:dev
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    build:
      context: ../..
      dockerfile: deploy/docker/base.Dockerfile
      args: { MEMBER: ctl, ENTRY: carto-ctl }
    # Root only for the chown of fresh named volumes to the carto uid; nothing else runs here.
    user: "0:0"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        chown 10001:10001 /mnt/pki-ingest-api /mnt/pki-edge-gateway /mnt/pki-otel-collector
        /mnt/pki-proxy /mnt/pki-api /mnt/pki-web /mnt/pki-ca /mnt/edge-state /mnt/sim-data
        /mnt/otel-queue
    volumes:
      - pki-ingest-api:/mnt/pki-ingest-api
      - pki-edge-gateway:/mnt/pki-edge-gateway
      - pki-otel-collector:/mnt/pki-otel-collector
      - pki-proxy:/mnt/pki-proxy
      - pki-api:/mnt/pki-api
      - pki-web:/mnt/pki-web
      - pki-ca:/mnt/pki-ca
      - edge-state:/mnt/edge-state
      - sim-data:/mnt/sim-data
      - otel-queue:/mnt/otel-queue
    restart: "no"

  pki-init:
    image: carto-ctl:dev
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    <<: *hardening
    restart: "no"
    network_mode: none
    depends_on:
      volumes-init: { condition: service_completed_successfully }
    volumes:
      - pki-ingest-api:/etc/carto/pki/ingest-api
      - pki-edge-gateway:/etc/carto/pki/edge-gateway
      - pki-otel-collector:/etc/carto/pki/otel-collector
      - pki-proxy:/etc/carto/pki/proxy
      - pki-api:/etc/carto/pki/api
      - pki-web:/etc/carto/pki/web
      - pki-ca:/etc/carto/pki-ca
    command:
      - pki
      - init
      - --out
      - /etc/carto/pki
      - --ca-key-dir
      - /etc/carto/pki-ca
      - --services
      - ingest-api,edge-gateway,otel-collector,proxy,api,web
      - --if-missing

  migrate:
    image: carto-core:dev
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    build:
      context: ../..
      dockerfile: deploy/docker/base.Dockerfile
      args: { MEMBER: core, ENTRY: carto-core }
    <<: *hardening
    restart: "no"
    networks: [core]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment: &core-env
      CARTO_POSTGRES__HOST: postgres
      CARTO_POSTGRES__DATABASE: carto
      CARTO_POSTGRES__USER: carto
      CARTO_POSTGRES__PASSWORD_FILE: /run/secrets/pg_password
      # The core network is internal to this host; TLS to the databases returns with M6.
      CARTO_POSTGRES__SSLMODE: disable
      CARTO_CLICKHOUSE__URL: http://clickhouse:8123
      CARTO_CLICKHOUSE__SECURE: "false"
      CARTO_CLICKHOUSE__DATABASE: carto
      CARTO_CLICKHOUSE__USER: carto
      CARTO_CLICKHOUSE__PASSWORD_FILE: /run/secrets/ch_password
    secrets: [pg_password, ch_password]
    command: ["migrate"]

  ingest-api:
    image: carto-core:dev
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    <<: *hardening
    networks: [core, edge]
    depends_on:
      migrate: { condition: service_completed_successfully }
      pki-init: { condition: service_completed_successfully }
    environment:
      <<: *core-env
      CARTO_POSTGRES__USER: carto_ingest
      CARTO_POSTGRES__PASSWORD_FILE: /run/secrets/pg_ingest_password
      CARTO_INGEST__HOST: 0.0.0.0
      CARTO_INGEST__PORT: "8443"
      # Its own listener CA signs its server certificate and the edge gateway's client one.
      CARTO_INGEST__TLS_CERT_FILE: /etc/carto/pki/listener.crt
      CARTO_INGEST__TLS_KEY_FILE: /etc/carto/pki/listener.key
      CARTO_INGEST__CLIENT_CA_FILE: /etc/carto/pki/listener-ca.crt
    secrets: [pg_ingest_password, ch_password]
    volumes:
      - pki-ingest-api:/etc/carto/pki:ro
    command: ["ingest-api"]
    healthcheck:
      # Mutual TLS: the probe presents the service's own certificate (carto-core healthcheck).
      test: ["CMD", "carto-core", "healthcheck", "--url", "https://localhost:8443/healthz"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

  api:
    image: carto-core:dev
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    <<: *hardening
    networks: [core]
    depends_on:
      migrate: { condition: service_completed_successfully }
      pki-init: { condition: service_completed_successfully }
    environment:
      <<: *core-env
      CARTO_POSTGRES__USER: carto_app
      CARTO_POSTGRES__PASSWORD_FILE: /run/secrets/pg_app_password
      CARTO_API__HOST: 0.0.0.0
      CARTO_API__PORT: "8443"
      # The console origin (what the browser uses); the web service publishes this port.
      CARTO_API__PUBLIC_URL: https://localhost:${CARTO_WEB_PORT:-8080}
      # Its own listener CA signs its server certificate and the web proxy's client one.
      CARTO_API__TLS_CERT_FILE: /etc/carto/pki/listener.crt
      CARTO_API__TLS_KEY_FILE: /etc/carto/pki/listener.key
      # Login through the identity provider named in .env; the dev profile runs Dex under the
      # console origin (/dex) and the api reaches it over the core network (ADR 0052).
      CARTO_API__OIDC__ISSUER: ${CARTO_OIDC_ISSUER:-https://localhost:8080/dex}
      CARTO_API__OIDC__BACKCHANNEL_URL: ${CARTO_OIDC_BACKCHANNEL_URL:-http://dex:5556/dex}
      CARTO_API__OIDC__ALLOW_HTTP_ISSUER: ${CARTO_OIDC_ALLOW_HTTP:-true}
      CARTO_API__OIDC__CLIENT_ID: ${CARTO_OIDC_CLIENT_ID:-carto-console}
      CARTO_API__OIDC__CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      # Dex's static users carry no groups, so the dev stack binds roles by the email claim;
      # a customer provider uses its groups claim (the default) and its own group names.
      CARTO_API__OIDC__GROUPS_CLAIM: ${CARTO_OIDC_GROUPS_CLAIM:-email}
      CARTO_API__OIDC__SCOPES: ${CARTO_OIDC_SCOPES:-openid profile email}
      CARTO_API__BOOTSTRAP_GROUP_ROLES: ${CARTO_OIDC_GROUP_ROLES:-{"admin@carto.local":"admin","engineer@carto.local":"integration_engineer","viewer@carto.local":"business_viewer","auditor@carto.local":"auditor"}}
      CARTO_API__CLIENT_CA_FILE: /etc/carto/pki/listener-ca.crt
      CARTO_API__REQUIRE_CLIENT_CERT: "true"
    secrets: [pg_app_password, ch_password, oidc_client_secret]
    volumes:
      - pki-api:/etc/carto/pki:ro
    command: ["api"]
    healthcheck:
      test: ["CMD", "carto-core", "healthcheck", "--url", "https://localhost:8443/api/v1/healthz", "--listener", "api"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

  worker:
    image: carto-core:dev
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    <<: *hardening
    networks: [core]
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      <<: *core-env
      CARTO_POSTGRES__USER: carto_worker
      CARTO_POSTGRES__PASSWORD_FILE: /run/secrets/pg_worker_password
    secrets: [pg_worker_password, ch_password]
    command: ["worker"]

  web:
    image: carto-web:dev
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    build:
      context: ../../web
      dockerfile: deploy/Dockerfile
    <<: *hardening
    tmpfs: ["/tmp:size=64m", "/var/cache/nginx:size=32m"]
    # The console origin: the one published port besides the push proxies (spec 14.5).
    networks: [core, ingress]
    ports:
      - "${CARTO_WEB_PORT:-8080}:8443"
    depends_on:
      api: { condition: service_healthy }
    volumes:
      - ./proxy-tls:/etc/carto/proxy-tls:ro
      - pki-web:/etc/carto/pki:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    <<: *hardening
    user: "10001:10001"
    networks: [core]
    environment:
      CARTO_DEX_ISSUER: ${CARTO_OIDC_ISSUER:-https://localhost:8080/dex}
      CARTO_DEX_REDIRECT_URI: https://localhost:${CARTO_WEB_PORT:-8080}/api/v1/auth/callback
      CARTO_DEX_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
    secrets: [oidc_client_secret]
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        CARTO_DEX_CLIENT_SECRET="$$(tr -d '\r\n' < /run/secrets/oidc_client_secret)"
        exec dex serve /etc/dex/config.yaml
    profiles: ["dev"]

  key-init:
    image: carto-ctl:dev
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    <<: *hardening
    restart: "no"
    network_mode: none
    depends_on:
      volumes-init: { condition: service_completed_successfully }
    volumes:
      - edge-state:/var/lib/carto
    command:
      - key
      - init
      - --state-dir
      - /var/lib/carto
      - --tenant-id
      - default
      - --kms
      - local
      - --if-missing

  edge-gateway:
    image: carto-edge:dev
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    build:
      context: ../..
      dockerfile: deploy/docker/base.Dockerfile
      args: { MEMBER: edge, ENTRY: carto-edge }
    <<: *hardening
    networks: [edge]
    depends_on:
      ingest-api: { condition: service_healthy }
      key-init: { condition: service_completed_successfully }
    environment:
      CARTO_STATE_DIR: /var/lib/carto
      CARTO_SOURCES_FILE: /etc/carto/sources.yaml
      CARTO_CORE__URL: https://ingest-api:8443
      # To ingest-api: a client certificate from the ingest-api CA (ADR 0031).
      CARTO_CORE__CA_FILE: /etc/carto/pki/to-ingest-api-ca.crt
      CARTO_CORE__CERT_FILE: /etc/carto/pki/to-ingest-api.crt
      CARTO_CORE__KEY_FILE: /etc/carto/pki/to-ingest-api.key
      CARTO_GATEWAY__HOST: 0.0.0.0
      CARTO_GATEWAY__PORT: "8443"
      CARTO_GATEWAY__TLS_CERT_FILE: /etc/carto/pki/listener.crt
      CARTO_GATEWAY__TLS_KEY_FILE: /etc/carto/pki/listener.key
      CARTO_GATEWAY__TLS_CLIENT_CA_FILE: /etc/carto/pki/listener-ca.crt
      CARTO_KMS__PROVIDER: local
    volumes:
      - edge-state:/var/lib/carto
      - pki-edge-gateway:/etc/carto/pki:ro
      - ./sources.dev.yaml:/etc/carto/sources.yaml:ro
      - sim-data:/data/sim:ro
    command: ["gateway"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    <<: *hardening
    networks: [edge]
    depends_on:
      edge-gateway: { condition: service_started }
      volumes-init: { condition: service_completed_successfully }
    user: "10001:10001"
    volumes:
      - ../../otel/collector.dev.yaml:/etc/otelcol-contrib/config.yaml:ro
      - pki-otel-collector:/etc/carto/pki:ro
      - sim-data:/data/sim:ro
      - otel-queue:/var/lib/otelcol/storage
    command: ["--config", "/etc/otelcol-contrib/config.yaml"]

  proxy-otlp:
    image: nginxinc/nginx-unprivileged:1.30.4-alpine
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    <<: *hardening
    profiles: ["push-otlp"]
    user: "10001:10001"
    networks: [edge, ingress]
    depends_on:
      edge-gateway: { condition: service_started }
    ports: ["${CARTO_OTLP_PORT:-4318}:4318"]
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./proxy/otlp.conf:/etc/nginx/nginx.conf:ro

  proxy-webhooks:
    image: nginxinc/nginx-unprivileged:1.30.4-alpine
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    <<: *hardening
    profiles: ["push-webhooks"]
    user: "10001:10001"
    networks: [edge, ingress]
    depends_on:
      edge-gateway: { condition: service_started }
      pki-init: { condition: service_completed_successfully }
    ports: ["${CARTO_WEBHOOK_PORT:-8443}:8443"]
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./proxy/webhooks.conf:/etc/nginx/nginx.conf:ro
      - ./proxy-tls:/etc/carto/proxy-tls:ro
      - pki-proxy:/etc/carto/pki:ro

  simulator:
    image: carto-simulator:dev
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    build:
      context: ../..
      dockerfile: deploy/docker/base.Dockerfile
      args: { MEMBER: simulator, ENTRY: carto-sim }
    <<: *hardening
    network_mode: none
    depends_on:
      volumes-init: { condition: service_completed_successfully }
    volumes:
      - sim-data:/data/sim
    command: ["live", "--scenario", "shop", "--days", "2", "--speed", "60", "--out", "/data/sim"]
    # A finished replay must not restart: a new run empties /data/sim and starts over.
    restart: "no"
    profiles: ["dev"]
