[project]
name = "carto-ctl"
version = "0.1.0"
description = "carto operator CLI: pki init, key init, audit verify, support bundle, restore drill, signature verification (spec Section 20)"
requires-python = ">=3.12"
dependencies = [
  "carto-common",
  "cryptography>=43",
]

[project.scripts]
carto-ctl = "carto_ctl.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carto_ctl"]
