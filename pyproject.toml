# carto workspace root. Not a distributable package; it pins the toolchain and shared tool
# configuration for every member (spec Section 20, ADR 0008).

[project]
name = "carto-workspace"
version = "0.0.0"
description = "carto v1 monorepo root (tooling only)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "hypothesis>=6.115",
  "jsonschema>=4.23",
  "ruff>=0.8",
  "mypy>=1.13",
  "bandit>=1.8",
  "pip-audit>=2.7",
  "pytest-asyncio>=0.24",
  "testcontainers>=4.9",
  "types-pyyaml>=6.0",
  "types-protobuf>=5",
  "types-pymysql>=1.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/*",
  "edge",
  "core",
  "simulator",
  "eval",
  "tools/carto-ctl",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
carto-schema = { workspace = true }
carto-common = { workspace = true }
carto-edge = { workspace = true }
carto-core = { workspace = true }
carto-simulator = { workspace = true }
carto-eval = { workspace = true }
carto-ctl = { workspace = true }

# ---------------------------------------------------------------------------------------------
# ruff: lint and format (Section 20). legacy/ is frozen and excluded (ADR 0005).
# ---------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy", "sim-out", "tools/semgrep", "*.md"]

[tool.ruff.lint]
select = [
  "E", "W", "F",      # pycodestyle, pyflakes
  "I",                # isort
  "B",                # bugbear
  "UP",               # pyupgrade
  "N",                # naming
  "S",                # bandit-style security checks
  "C4",               # comprehensions
  "SIM",              # simplify
  "RUF",              # ruff-specific
  "DTZ",              # timezone-aware datetimes only (every timestamp is UTC, Section 8.2)
  "T20",              # no stray print
  "PTH",              # pathlib
  "ANN",              # annotations everywhere (mypy --strict backs this)
  "ARG",              # unused arguments
  "ERA",              # no commented-out code
  "ISC",              # implicit string concatenation
  "RET",              # return consistency
  "PIE",
  "PERF",
  "FURB",
  "LOG", "G",         # logging hygiene
  "TID",              # tidy imports
  "PLC", "PLE", "PLW",
]
ignore = [
  "ANN401",   # explicit Any is allowed where the type is genuinely dynamic (parsers)
  "ISC001",   # conflicts with the formatter
  "RUF012",   # mutable class attributes are checked by mypy
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "ANN", "PLR2004", "ARG001", "ARG002", "DTZ001", "S311", "PLC1901"]
"**/cli.py" = ["T201"]
"**/cli/**" = ["T201"]
"simulator/**" = ["S311"]   # synthetic data uses random on purpose; crypto never lives here

[tool.ruff.lint.isort]
known-first-party = [
  "carto_schema", "carto_common", "carto_edge", "carto_core",
  "carto_simulator", "carto_eval", "carto_ctl",
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------------------------------------
# mypy --strict across every member in one run (ADR 0008: unique test file names, no conftest
# duplicates).
# ---------------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "packages/carto-schema,packages/carto-common,edge,core,simulator,eval,tools/carto-ctl"
files = [
  "packages/carto-schema",
  "packages/carto-common",
  "edge",
  "core",
  "simulator",
  "eval",
  "tools/carto-ctl",
]
exclude = ["^legacy/", "/build/", "/dist/"]

[[tool.mypy.overrides]]
module = [
  "drain3.*",
  "datasketch.*",
  "presidio_analyzer.*",
  "metaphone.*",
  "re2.*",
  "testcontainers.*",
  "asyncssh.*",
  "clickhouse_connect.*",
  "pyodbc.*",
  "spacy.*",
  "opentelemetry.*",
  "google.protobuf.*",
  "defusedxml.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "packages/carto-schema/tests",
  "packages/carto-common/tests",
  "edge/tests",
  "core/tests",
  "simulator/tests",
  "eval/tests",
  "tools/carto-ctl/tests",
]
addopts = "-q --import-mode=importlib --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "integration: needs Docker-backed services; skipped locally when the daemon is unreachable",
  "slow: long-running tests, always run in CI",
]

[tool.coverage.run]
branch = true
source_pkgs = [
  "carto_schema", "carto_common", "carto_edge", "carto_core",
  "carto_simulator", "carto_eval", "carto_ctl",
]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# M1 raises this to 85 for edge/pipeline, core/linker, core/assembler, core/detector (Section 18.1).
fail_under = 0

# ---------------------------------------------------------------------------------------------
# bandit (Section 6). B311 (random) is covered by ruff S311 outside the simulator.
# ---------------------------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["legacy", ".venv", "tests", "sim-out", "tools/semgrep"]
skips = ["B311"]
