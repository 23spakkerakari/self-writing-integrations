# Alembic configuration for the carto PostgreSQL metadata store (spec 7.3, Section 20).
#
# No sqlalchemy.url here: carto-core migrate builds the engine from CARTO_POSTGRES__* settings
# (password from a file, TLS as configured) and hands the connection to env.py through
# config.attributes["connection"]. An ad-hoc `alembic -c core/migrations/postgres/alembic.ini`
# run therefore needs `-x url=postgresql+psycopg://...` and is for emergencies only.

[alembic]
script_location = %(here)s
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = UTC
version_path_separator = os
