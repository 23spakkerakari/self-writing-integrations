# web (ADR 0052): one origin for the console. nginx serves the static build at / and proxies
# /api/ to the api service over mutual TLS. /metrics, /internal/ and everything else the api
# exposes for the network only are never proxied. It terminates TLS on 8443 with the certificate
# in /etc/carto/proxy-tls (the Compose pilot; a customer ingress may terminate in front instead
# and reach the plain 8080 listener); the headers below are set here so they hold whatever the
# ingress does. Image: nginxinc/nginx-unprivileged:1.30.4-alpine (as the push-route proxies in
# deploy/compose/compose.yaml), uid 10001. Under the Compose dev profile /dex/ is proxied to the
# development identity provider; the upstream is resolved per request so a stack without Dex
# still starts.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;
    # Method, path without the query string, status and timing; never a header or a body.
    log_format carto escape=json
        '{"service":"web","method":"$request_method","path":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time}';
    access_log /dev/stdout carto;

    # Spec 14.7 rate limits are the api's business per user; this is a coarse per-IP backstop.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;

    client_max_body_size 1m;
    large_client_header_buffers 4 8k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Spec 14.7 headers, on every response (`always` keeps them on errors too). The CSP is the
    # one in web/src/csp.ts and the build's meta tag, verbatim.
    map $sent_http_content_type $csp {
        default "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'";
    }

    upstream api {
        server api:8443;
        keepalive 16;
    }

    # Docker's embedded DNS; lets the optional dex upstream resolve lazily.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 8080;
        listen 8443 ssl;
        ssl_certificate /etc/carto/proxy-tls/tls.crt;
        ssl_certificate_key /etc/carto/proxy-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;
        root /usr/share/nginx/html;
        index index.html;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header X-Frame-Options DENY always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;

        # Hashed assets are immutable; index.html and the fonts are revalidated.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Content-Security-Policy $csp always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }
        location /fonts/ {
            add_header Cache-Control "public, max-age=604800" always;
            add_header Content-Security-Policy $csp always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # The api's own health for the ingress; detail-free (spec 12).
        location = /healthz {
            return 200 'ok';
            add_header Content-Type text/plain always;
        }

        # Never proxied: the api's metrics and internal routes stay on the internal network.
        location ~ ^/(metrics|api/v1/metrics|api/v1/internal|internal)(/|$) {
            return 404;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;

            proxy_pass https://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_request_buffering on;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 30s;
            # The api sets the __Host- session cookie itself; nothing is rewritten here.
            proxy_cookie_path off;
            proxy_hide_header X-Powered-By;

            # Mutual TLS to the api: its listener CA, verified by name, and this service's
            # client certificate with the `web` role from `carto-ctl pki init`
            # (ADR 0031/0052; paths are placeholders the orchestrator wires to the pki volume).
            proxy_ssl_certificate /etc/carto/pki/to-api.crt;
            proxy_ssl_certificate_key /etc/carto/pki/to-api.key;
            proxy_ssl_trusted_certificate /etc/carto/pki/to-api-ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_name api;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_session_reuse on;
        }

        # Development identity provider (Compose dev profile, ADR 0052): the browser reaches
        # Dex under the console origin; the api reaches it over the core network directly.
        location /dex/ {
            set $dex_upstream http://dex:5556;
            proxy_pass $dex_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }

        # The single-page app: every other path serves index.html, with the headers above.
        location / {
            add_header Cache-Control "no-store" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy $csp always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
            add_header X-Frame-Options DENY always;
            try_files $uri /index.html;
        }
    }
}
