[project]
name = "self-writing-integrations"
version = "0.1.0"
description = "Agentic platform that synthesizes, verifies, publishes and maintains API integrations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
