[project]
name = "carto-eval"
version = "0.1.0"
description = "carto eval harness: scores engine output against simulator ground truth (spec Section 18.4)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "carto-simulator",
]

[project.scripts]
carto-eval = "carto_eval.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carto_eval"]
