# CI for carto (spec Section 6 "Security CI", Section 14.8, Section 20).
# Every job runs on pull requests and on pushes to main. Scanners fail the build on high and
# critical findings; exceptions with an expiry go in docs/security-exceptions.md.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  python:
    name: lint, types, tests, schema, simulator, eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install workspace
        run: uv sync --locked --all-packages
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format check
        run: uv run ruff format --check .
      - name: Types (mypy --strict)
        run: uv run mypy
      - name: Tests (unit and property; integration tests run in their own job)
        run: uv run pytest -m "not integration" --cov --cov-report=xml --cov-report=term
      - name: JSON Schema drift check
        run: uv run carto-schema check --dir packages/carto-schema/schemas
      - name: Simulator scenario A (14 days)
        run: make sim SCENARIO=shop DAYS=14 SEED=1
      - name: Eval harness
        run: make eval SCENARIO=shop DAYS=14 SEED=1
      - name: Simulator output summary
        run: |
          echo "## Simulator output" >> "$GITHUB_STEP_SUMMARY"
          du -sh sim-out/shop >> "$GITHUB_STEP_SUMMARY"
          find sim-out/shop -type f | wc -l | xargs -I{} echo "{} files" >> "$GITHUB_STEP_SUMMARY"
          echo "## Eval report" >> "$GITHUB_STEP_SUMMARY"
          cat eval/reports/shop.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  integration:
    name: integration (testcontainers, leak test, analyzer, bundle round trip)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install workspace
        run: uv sync --locked --all-packages
      - name: Simulator scenario A (14 days)
        run: make sim SCENARIO=shop DAYS=14 SEED=1
      - name: Docker-backed integration tests (PostgreSQL, MySQL, ClickHouse)
        run: uv run pytest -m integration -q
      - name: Offline analyzer over scenario A
        run: make analyze SCENARIO=shop
      - name: Leak test (spec 18.3)
        run: make leak SCENARIO=shop
      - name: Throughput benchmark (spec 17, informative on shared runners)
        run: make bench SCENARIO=shop | tee bench.txt
      - name: Benchmark summary
        run: |
          echo "## Edge benchmark" >> "$GITHUB_STEP_SUMMARY"
          cat bench.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-manifest
          path: |
            sim-out/shop.carto/manifest.json
            sim-out/shop.carto/MANIFEST.md
          if-no-files-found: error

  images:
    name: service images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build carto-edge
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/base.Dockerfile
          build-args: |
            MEMBER=edge
            ENTRY=carto-edge
          push: false
          load: true
          tags: carto-edge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build carto-core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/base.Dockerfile
          build-args: |
            MEMBER=core
            ENTRY=carto-core
          push: false
          load: true
          tags: carto-core:ci
          cache-from: type=gha
      - name: Smoke test the images (run as non-root, print version)
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges carto-edge:ci --help | head -5
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges carto-core:ci --help | head -5
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: carto-edge:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  compose:
    name: compose stack (simulator live replay, ingest to ClickHouse, live leak scan)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE: docker compose -f deploy/compose/compose.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Build the service images
        run: make images
      - name: Generate the database passwords
        run: |
          openssl rand -hex 24 > deploy/compose/secrets/pg_password
          openssl rand -hex 24 > deploy/compose/secrets/ch_password
      - name: Start the stack (one-shot jobs, databases, ingest-api, edge-gateway, collector)
        run: |
          $COMPOSE up -d
          for i in $(seq 1 60); do
            id=$($COMPOSE ps -q ingest-api)
            health=$(docker inspect -f '{{.State.Health.Status}}' "$id" 2>/dev/null || echo starting)
            echo "ingest-api: $health"
            [ "$health" = healthy ] && break
            sleep 5
          done
          [ "$health" = healthy ]
          $COMPOSE ps -a
          for job in volumes-init pki-init key-init migrate; do
            code=$(docker inspect -f '{{.State.ExitCode}}' "$($COMPOSE ps -aq $job)")
            echo "$job exited $code"
            [ "$code" = 0 ]
          done
      - name: The one-shot jobs are idempotent (a second up changes nothing)
        run: |
          $COMPOSE up -d
          for job in pki-init key-init migrate; do
            [ "$(docker inspect -f '{{.State.ExitCode}}' "$($COMPOSE ps -aq $job)")" = 0 ]
          done
      - name: Replay one simulated day at high speed into the stack
        run: >
          $COMPOSE --profile dev run --rm -T simulator live --scenario shop --days 1
          --daily-volume 40 --seed 3 --speed 100000 --out /data/sim
      - name: Wait for events in ClickHouse
        run: |
          query() {
            $COMPOSE exec -T clickhouse clickhouse-client --user carto \
              --password "$(cat deploy/compose/secrets/ch_password)" -q "$1"
          }
          for i in $(seq 1 72); do
            events=$(query "SELECT count() FROM carto.events" || echo 0)
            sources=$(query "SELECT uniqExact(source_id) FROM carto.events" || echo 0)
            echo "events: $events from $sources sources"
            [ "${sources:-0}" -ge 6 ] && break
            sleep 5
          done
          [ "${events:-0}" -gt 0 ]
          query "SELECT source_id, count() FROM carto.events GROUP BY source_id ORDER BY source_id"
          echo "## Compose stack" >> "$GITHUB_STEP_SUMMARY"
          echo "events in ClickHouse: $events from $sources sources" >> "$GITHUB_STEP_SUMMARY"
      - name: Export rows, markers and logs
        run: |
          mkdir -p scan
          for table in events event_identifiers; do
            $COMPOSE exec -T clickhouse clickhouse-client --user carto \
              --password "$(cat deploy/compose/secrets/ch_password)" \
              -q "SELECT * FROM carto.$table FORMAT JSONEachRow" > "scan/$table.ndjson"
          done
          $COMPOSE --profile dev run --rm -T --entrypoint cat simulator \
            /data/sim/ground_truth/markers.json > scan/markers.json
          $COMPOSE logs --no-color --no-log-prefix ingest-api edge-gateway migrate > scan/logs.txt
          wc -c scan/*
      - name: Leak scan of everything core stored and every product log (spec 18.3)
        run: >
          python3 tools/ci/leak_scan.py --markers scan/markers.json
          --rows scan/events.ndjson --rows scan/event_identifiers.ndjson --text scan/logs.txt
      - name: Stack logs on failure
        if: failure()
        run: $COMPOSE --profile dev logs --no-color | tail -n 400
      - name: Tear down
        if: always()
        run: $COMPOSE --profile dev down -v --remove-orphans

  bandit:
    name: bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --all-packages
      - run: uv run bandit -c pyproject.toml -r packages edge core simulator eval tools -q

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --all-packages
      - name: Export locked requirements (all members, dev included)
        run: uv export --all-packages --no-emit-workspace --no-hashes --format requirements-txt -o requirements-export.txt
      - run: uv run pip-audit -r requirements-export.txt --strict --desc on

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Rule self-tests (spec 18.3)
        run: semgrep --test --metrics=off tools/semgrep
      - name: Read-only connector rule over connector modules (spec 8.1, ADR 0008)
        run: semgrep scan --config tools/semgrep --error --metrics=off edge/carto_edge/connectors
      - name: Registry rulesets over the repository
        run: semgrep scan --config p/python --config p/secrets --error --metrics=off --exclude legacy --exclude tools/semgrep .

  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan the lockfile
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:latest scan source --lockfile /src/uv.lock

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: trivy (filesystem)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: legacy
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
