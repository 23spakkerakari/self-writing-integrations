[project]
name = "carto-schema"
version = "0.1.0"
description = "carto canonical event and edge-to-core contract models, with JSON Schema export (spec 7.1, 8.4, 12)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
]

[project.scripts]
carto-schema = "carto_schema.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carto_schema"]
