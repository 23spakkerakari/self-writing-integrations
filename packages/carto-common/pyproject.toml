[project]
name = "carto-common"
version = "0.1.0"
description = "carto shared runtime pieces: settings, logging with redaction, ids (spec Section 20)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carto_common"]
